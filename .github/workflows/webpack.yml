name: Validate static app

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # No package.json or bundler exists in this project: it is plain
    # HTML/CSS/JS served as-is. Validate required files and JS syntax.
    - name: Check required files exist
      run: |
        test -f index.html
        test -f styles.css
        test -f app.js
        test -f functions/api/chat.js
        test -f wrangler.toml

    - name: Syntax-check JavaScript
      run: |
        node --check app.js
        node --check ai-worker.js
        node --check sw.js
        node --check functions/api/chat.js
