name: Static Site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # This project is a dependency-free static site (plain HTML/CSS/JS, no
    # package.json or bundler), so there is nothing to install or build.
    # Instead, validate the deployable files directly.
    - name: Verify required site files exist
      run: |
        for file in index.html styles.css app.js chat.js ai-worker.js sw.js manifest.webmanifest icon.png; do
          if [ ! -f "$file" ]; then
            echo "Missing required file: $file"
            exit 1
          fi
        done

    - name: Syntax-check JavaScript files
      run: |
        for file in app.js chat.js ai-worker.js sw.js; do
          node --check "$file"
        done
