<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Chat">
  <meta name="description" content="A simple AI chat app with text-file support.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Pocket Chat — AI assistant</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true">✦</span><span>Pocket Chat<small>AI assistant</small></span></div>
      <button id="newChat" class="small-button" type="button" title="Clear conversation">New chat</button>
    </header>

    <div class="notice" role="status" aria-live="polite"><span id="statusDot" class="dot"></span><span id="status">AI not loaded</span></div>

    <section id="conversation" class="conversation" aria-label="Chat conversation" aria-live="polite" aria-relevant="additions text">
      <div class="welcome" id="welcome">
        <div class="large-logo" aria-hidden="true">✦</div>
        <h1>What can I help with?</h1>
        <p>Ask a question or attach a text file to get started.</p>
        <div class="suggestions" aria-label="Suggested prompts">
          <button class="suggestion" type="button" data-prompt="Explain this topic in simple terms">Explain a topic</button>
          <button class="suggestion" type="button" data-prompt="Help me brainstorm some ideas">Brainstorm ideas</button>
          <button class="suggestion" type="button" data-prompt="Summarize this text">Summarize text</button>
          <button class="suggestion" type="button" data-prompt="Help me write a friendly message">Draft a message</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
    </section>

    <footer class="composer-area">
      <form id="chatForm" class="composer">
        <label for="fileInput" class="attach-button" title="Attach a text file" aria-label="Attach a text file">+</label>
        <input id="fileInput" class="sr-only" type="file" accept=".txt,.md,.csv,.json,.log,text/plain,text/markdown,text/csv,application/json">
        <label for="prompt" class="sr-only">Write a message</label>
        <textarea id="prompt" maxlength="1000" rows="1" placeholder="Message Pocket Chat…"></textarea>
        <button id="sendButton" aria-label="Send message" class="send-button" type="submit" disabled>↑</button>
      </form>
      <div id="attachmentPreview" class="attachment-preview" hidden><span id="attachmentName"></span><button id="removeAttachment" type="button" aria-label="Remove attached file">Remove</button></div>
      <p class="footnote">AI responses can be inaccurate. Messages and attached text are sent to Cloudflare Workers AI. Avoid sharing sensitive information.</p>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
